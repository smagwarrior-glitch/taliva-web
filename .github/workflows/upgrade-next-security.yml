name: Upgrade Next.js security release

on:
  push:
    branches:
      - feat/core-database-auth
    paths:
      - .github/workflows/upgrade-next-security.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/core-database-auth

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade patched Next.js packages
        run: npm install --save-exact next@16.3.6 eslint-config-next@16.3.6

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: upgrade Next.js security release"
          git push origin HEAD:feat/core-database-auth
